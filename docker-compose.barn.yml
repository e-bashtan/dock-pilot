# VPS stack: bundled PostgreSQL + API + frontend (nginx/certbot on host).
# Primary compose file for Barn deployments.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-barn-postgres:latest}
    container_name: barn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-barn}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - barn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barn} -d ${POSTGRES_DB:-barn}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  migrate:
    image: ${MIGRATE_IMAGE:-barn-migrate:latest}
    container_name: barn-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      GOOSE_DRIVER: postgres
      # Always disable SSL for bundled Postgres (ignore .env sslmode).
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-barn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-barn}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-barn-api:latest}
    container_name: barn-api
    restart: unless-stopped
    network_mode: host
    user: root
    pid: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-barn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:${POSTGRES_HOST_PORT:-5433}/${POSTGRES_DB:-barn}?sslmode=disable
      HTTP_ADDR: 127.0.0.1:${API_PORT:-8080}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      DEPLOY_MODE: ${DEPLOY_MODE:-real}
      DEPLOY_WORK_DIR: ${DEPLOY_WORK_DIR:-/var/lib/barn}
      HOST_ROOT: ${HOST_ROOT:-/host}
      NGINX_SITES_AVAILABLE: ${NGINX_SITES_AVAILABLE:-/host/etc/nginx/sites-available}
      NGINX_SITES_ENABLED: ${NGINX_SITES_ENABLED:-/host/etc/nginx/sites-enabled}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      TELEGRAM_HTTP_PROXY: ${TELEGRAM_HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - barn_work:${DEPLOY_WORK_DIR:-/var/lib/barn}
      - /:/host
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-barn-frontend:latest}
    container_name: barn-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  barn_pg:
  barn_work:
